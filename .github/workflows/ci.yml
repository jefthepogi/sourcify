name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install contract dependencies
        run: npm --prefix contracts ci

      - name: Run contract tests
        run: npm --prefix contracts test

      - name: Verify Hardhat compilation
        working-directory: contracts
        run: npx hardhat compile

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Slither toolchain
        run: python -m pip install -r tools/requirements-audit.txt

      - name: Static analysis (Slither, pinned) — fails on Medium or higher
        working-directory: contracts
        env:
          SOLCJS: "1"
        run: |
          slither . \
            --config-file slither.config.json \
            --fail-medium

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build

  clean-clone-smoke:
    name: environment reproduces from a clean clone
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm run setup
      - run: npm run smoke